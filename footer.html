<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOTER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="footer.css">
</head>
<body>
<body>
    <footer>
        <div class="footer-left">
            <img src="./utc-logo.png" alt="UTC Logo" class="logo">
            <div class="content-logo">
                <h3>LIBRARY</h3>
                <p>UNIVERSITY OF TRANSPORT AND COMMUNICATIONS</p>
            </div>
        </div>
        <div class="footer-center">
            <h4>Kết Nối Với Chúng Tôi</h4>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <p><i class="fa-solid fa-phone"></i>1900-1900</p>
                <p><i class="fa-solid fa-location-dot"></i>Số 3 Cầu Giấy, Hà Nội, Việt Nam.</p>
            </div>
        </div>
        <div class="footer-right">
            <h4>CÁC LIÊN KẾT KHÁC</h4>
            <div class="app-links">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
            </div>
        </div>
    </footer>
</body>
</html>
